[project]
name = "llmpuffin"
version = "0.1.0"
description = "Agentic codebase security review harness powered by structured threat models"
readme = "README.md"
authors = [
    { name = "Max Ammann", email = "max.ammann@zoo.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents[quickjs]",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "jinja2>=3",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "markdown",
    "langchain-anthropic>=1.4.4",
    "langchain-openai>=1.3.2",
    "langgraph-checkpoint-postgres",
    "docker>=7",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "sarif-om>=1.0",
    "nh3>=0.3.5",
    "pygithub>=2.9.1",
    "python-multipart>=0.0.29",
    "authlib>=1.7.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
nexecutor = ["nexecutor-client"]
microvm = ["boto3", "awscli"]

[tool.uv.sources]
nexecutor-client = { git = "https://github.com/KittyCAD/nexecutor.git", subdirectory = "clients/python" }

[project.scripts]
llmpuffin = "llmpuffin.__main__:main"
llmpuffin-run = "llmpuffin_dev.run:main"
llmpuffin-check = "llmpuffin_dev.check:main"
llmpuffin-pg = "llmpuffin_dev.postgres:main"
llmpuffin-oidc = "llmpuffin_dev.oidc_server:main"
llmpuffin-fastapi = "llmpuffin_fastapi.main:main"
llmpuffin-microvm-agent = "llmpuffin_microvm_agent.main:main"

[tool.ruff]
src = ["src"]


[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.9.13,<0.12.0"]
build-backend = "uv_build"
