{% extends "base.html" %}
{% block title %}checkpoints{% endblock %}
{% block content %}
<h1>checkpoints</h1>
<table>
<tr><th>Thread ID</th><th>Checkpoints</th><th>Status</th></tr>
{% for s in sessions %}
<tr>
  <td><a href="/checkpoints/{{ s.thread_id }}/">{{ s.thread_id }}</a></td>
  <td>{{ s.steps }}</td>
  <td>{{ s.status or "—" }}</td>
</tr>
{% else %}
<tr><td colspan="3">No checkpoints yet.</td></tr>
{% endfor %}
</table>
{% endblock %}
