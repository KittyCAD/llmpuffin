{% if not has_data %}
<div class="card">
  <p class="text-muted" style="text-align: center; padding: 2rem;">
    No coverage data available for this run.
  </p>
  <p class="text-xs text-muted" style="text-align: center;">
    Coverage is collected automatically at the end of an audit run.
  </p>
</div>
{% else %}

<div class="card col gap-3">
  <div class="row gap-4" style="align-items: baseline;">
    <div>
      <span class="text-2xl" style="font-weight: 600;">{{ "%.0f"|format(overall_pct) }}%</span>
      <span class="text-muted text-sm"> files reached</span>
    </div>
    <div class="text-sm text-muted">
      {{ accessed_files }} of {{ total_files }} files
    </div>
  </div>
  <div style="background: var(--muted); border-radius: 4px; height: 8px; overflow: hidden;">
    <div style="background: var(--primary); height: 100%; width: {{ overall_pct }}%; transition: width 0.3s;"></div>
  </div>
</div>

<div class="card" style="padding: 1rem 20%;">
  <div data-treemap='{{ coverage_json }}'></div>
</div>

{% endif %}
