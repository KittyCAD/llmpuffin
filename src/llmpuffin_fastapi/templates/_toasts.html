{# Toast system: Alpine store + htmx bridges. Included from base.html. #}
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.store("toasts", {
      items: [],
      _id: 0,
      push(level, message) {
        const id = ++this._id;
        this.items.push({ id, level: level || "info", message: message || "" });
        setTimeout(() => this.dismiss(id), 4500);
      },
      dismiss(id) {
        this.items = this.items.filter(x => x.id !== id);
      },
    });
  });

  // Surface stashed toast (across HX-Location nav) + URL params on first load.
  document.addEventListener("alpine:initialized", () => {
    const toasts = Alpine.store("toasts");
    try {
      const pending = JSON.parse(sessionStorage.getItem("llmpuffin.pendingToast") || "null");
      if (pending) {
        sessionStorage.removeItem("llmpuffin.pendingToast");
        toasts.push(pending.level, pending.message);
      }
    } catch (e) {}
    try {
      const p = new URLSearchParams(window.location.search);
      let changed = false;
      ["success", "error", "info"].forEach(k => {
        const v = p.get(k);
        if (v) { toasts.push(k, v); p.delete(k); changed = true; }
      });
      if (changed) {
        const qs = p.toString();
        history.replaceState({}, "", window.location.pathname + (qs ? "?" + qs : "") + window.location.hash);
      }
    } catch (e) {}
  });

  // htmx → toast bridges.
  document.addEventListener("toast", e => {
    const d = e.detail || {};
    Alpine.store("toasts").push(d.level, d.message);
  });
  document.addEventListener("htmx:beforeOnLoad", e => {
    const xhr = e.detail && e.detail.xhr;
    if (!xhr || !xhr.getResponseHeader) return;
    const trigger = xhr.getResponseHeader("HX-Trigger");
    const loc = xhr.getResponseHeader("HX-Location");
    if (trigger && loc) {
      try {
        const parsed = JSON.parse(trigger);
        if (parsed && parsed.toast) {
          sessionStorage.setItem("llmpuffin.pendingToast", JSON.stringify(parsed.toast));
        }
      } catch (e) {}
    }
  });
  document.addEventListener("htmx:responseError", e => {
    const xhr = e.detail && e.detail.xhr;
    Alpine.store("toasts").push("error", "Request failed" + (xhr ? " (" + xhr.status + ")" : ""));
  });
  document.addEventListener("htmx:sendError", () => {
    Alpine.store("toasts").push("error", "Network error");
  });
</script>
